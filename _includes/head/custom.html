{% include base_path %}

<!-- start custom head snippets -->

<!-- Support for jQuery, this needs to be first so that it has a chance to load. -->
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>

<!-- Support for Academicons -->
<link rel="preload" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css"></noscript>

<!-- Support for Font Awesome -->
 <link rel="preload" href="{{ base_path }}/assets/css/fontawesome.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="{{ base_path }}/assets/css/fontawesome.css"></noscript>

<!-- favicon from https://commons.wikimedia.org/wiki/File:OOjs_UI_icon_academic-progressive.svg -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="icon" href="/images/favicon.ico"/>
<meta name="theme-color" content="var(--global-bg-color)"/>

<style>
  @media (min-width: 768px) {
    .feature__item .archive__item-excerpt {
      min-height: 4.5em;
    }
  }

  {% if page.url == '/' %}
  .page__title {
    line-height: 1.2;
    margin-bottom: 0.9em;
  }

  .page__content .home-intro {
    font-size: 1.1em;
    line-height: 1.6;
    margin-bottom: 0.8em;
  }
  {% endif %}

  .home-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.75em 1.5em;
    margin: 1.5em 0 2em;
  }

  .home-actions .btn {
    margin: 0;
  }

  .home-actions__format {
    margin-left: 0.5em;
    font-size: 0.75em;
    font-weight: 400;
  }

  .home-actions__contact {
    font-size: 0.85em;
  }

  .home-index {
    margin: 0;
    border-top: 1px solid var(--global-border-color);
  }

  .page__content a.home-index__row,
  .page__content a.home-index__row:hover {
    display: grid;
    grid-template-columns: 6.5em minmax(0, 1fr) auto;
    column-gap: 1.5rem;
    align-items: baseline;
    margin: 0;
    padding: 1.15em 0;
    border-bottom: 1px solid var(--global-border-color);
    color: var(--global-text-color);
    font-size: 1em;
    font-weight: 400;
    line-height: 1.45;
    text-decoration: none;
  }

  .home-index__name {
    color: var(--global-link-color);
    font-weight: 600;
    font-size: 0.9em;
  }

  .home-index__note {
    font-size: 0.9em;
    line-height: 1.65;
  }

  .home-index__arrow {
    color: var(--global-link-color);
    font-size: 0.85em;
  }

  .home-index__row:focus-visible,
  .home-actions a:focus-visible {
    outline: 2px solid var(--global-link-color);
    outline-offset: 4px;
  }

  .page__content a.home-index__row:hover .home-index__name,
  .page__content a.home-index__row:focus-visible .home-index__name {
    text-decoration: underline;
    text-underline-offset: 0.2em;
  }

  @media (max-width: 599px) {
    .page__content a.home-index__row,
    .page__content a.home-index__row:hover {
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 0.4em 1em;
    }

    .home-index__note {
      grid-column: 1;
    }

    .home-index__arrow {
      grid-column: 2;
      grid-row: 1;
    }
  }

  figure.app-shots {
    justify-content: center;
    gap: 0.75em;
  }

  figure.app-shots > a {
    max-width: 220px;
  }

  figure.app-shots img {
    border-radius: 1.15rem;
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.16);
  }

  figure.app-shots figcaption {
    width: 100%;
    font-family: inherit;
    font-size: 1em;
    font-weight: inherit;
    color: inherit;
    text-align: center;
  }

  @media (max-width: 599px) {
    figure.app-shots > a {
      width: calc(33.3333% - 0.5em);
    }
  }
</style>

<!-- end custom head snippets -->
