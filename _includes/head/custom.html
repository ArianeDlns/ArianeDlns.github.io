{% include base_path %}

<!-- start custom head snippets -->

<!-- Support for jQuery, this needs to be first so that it has a chance to load. -->
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>

<!-- Support for Academicons -->
<link rel="preload" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css"></noscript>

<!-- Support for Font Awesome -->
 <link rel="preload" href="{{ base_path }}/assets/css/fontawesome.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="{{ base_path }}/assets/css/fontawesome.css"></noscript>

<!-- favicon from https://commons.wikimedia.org/wiki/File:OOjs_UI_icon_academic-progressive.svg -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="icon" href="/images/favicon.ico"/>
<meta name="theme-color" content="var(--global-bg-color)"/>

<style>
  @media (min-width: 768px) {
    .feature__item .archive__item-excerpt {
      min-height: 4.5em;
    }
  }

  .home-picks {
    display: grid;
    grid-template-columns: 1fr;
    gap: 0.9rem;
    margin: 1.75rem 0 0.5rem;
  }

  @media (min-width: 768px) {
    .home-picks {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1rem;
    }
  }

  .page__content a.home-pick,
  .page__content a.home-pick:hover {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    height: 100%;
    margin: 0;
    padding: 1.05rem 1.1rem 1.2rem;
    border: 1px solid var(--global-border-color);
    border-top: 3px solid var(--global-base-color);
    border-radius: 4px;
    color: var(--global-text-color);
    text-decoration: none;
    box-sizing: border-box;
  }

  .page__content a.home-pick:hover {
    border-color: var(--global-base-color);
  }

  .home-pick__kicker {
    font-family: inherit;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--global-link-color);
  }

  .home-pick__title {
    font-size: 1.15rem;
    font-weight: 700;
    line-height: 1.25;
  }

  .home-pick__text {
    font-size: 1rem;
    font-weight: 400;
    line-height: 1.45;
  }

  figure.app-shots {
    justify-content: center;
    gap: 0.75em;
  }

  figure.app-shots > a {
    max-width: 220px;
  }

  figure.app-shots img {
    border-radius: 1.15rem;
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.16);
  }

  figure.app-shots figcaption {
    width: 100%;
    font-family: inherit;
    font-size: 1em;
    font-weight: inherit;
    color: inherit;
    text-align: center;
  }

  @media (max-width: 599px) {
    figure.app-shots > a {
      width: calc(33.3333% - 0.5em);
    }
  }
</style>

<!-- end custom head snippets -->
